<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mototaxi 3D Simulator</title>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/mototaxi.css">
</head>
<body>
    
    <!-- Canvas Contenedor de Three.js -->
    <div id="game-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="hud-top">
            <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> SALIR</a>
            <div class="score-board">
                <h2>SCORE: <span id="score-display">0</span></h2>
            </div>
        </div>

        <!-- Controles móviles (ocultos en PC por CSS) -->
        <div class="mobile-controls">
            <div class="btn-mobile" id="btn-left"><i class="fas fa-arrow-left"></i></div>
            <div class="btn-mobile" id="btn-right"><i class="fas fa-arrow-right"></i></div>
        </div>
    </div>

    <!-- Pantalla de Game Over -->
    <div id="game-over-screen" class="hidden">
        <h1>SYSTEM FAILURE</h1>
        <h2>HAS CHOCADO</h2>
        <h2 style="color: #00f3ff; margin-top: -20px; font-size: 1.5rem;">SCORE FINAL: <span id="final-score">0</span></h2>
        <button id="btn-restart" class="btn-restart"><i class="fas fa-redo"></i> REINICIAR</button>
    </div>

    <!-- Three.js Librería Base -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/ColladaLoader.js"></script>
    
    <!-- Lógica del Juego -->
    <script src="dist/js/mototaxi_game.js"></script>

</body>
</html>
