server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para carga rápida
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Ruta principal para SPA y archivos HTML
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tipos específicos para modelos 3D
    location ~* \.dae$ {
        default_type application/xml;
        add_header Access-Control-Allow-Origin *;
    }

    location ~* \.glb$ {
        default_type model/gltf-binary;
        add_header Access-Control-Allow-Origin *;
    }

    # Caché para activos estáticos (imágenes, modelos, estilos)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|dae|glb|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Error 404 redirige al inicio
    error_page 404 /index.html;
}
