server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Tipos MIME completos con soporte para HTML, CSS, JS, imágenes y modelos 3D
    types {
        include /etc/nginx/mime.types;
        application/xml                      dae;
        model/gltf-binary                    glb;
        model/gltf+json                      gltf;
        font/woff2                           woff2;
        font/woff                            woff;
        font/ttf                             ttf;
    }
    default_type text/html;

    # Compresión Gzip para carga ultra-rápida
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Ruta principal
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Caché para activos estáticos (imágenes, modelos 3D, CSS, JS)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|dae|glb|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Manejo de error 404
    error_page 404 /index.html;
}
